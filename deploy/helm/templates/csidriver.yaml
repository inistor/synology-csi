{{- if $.Values.installCSIDriver }}
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  labels: {{- include "synology-csi.labels" $ | nindent 4 }}
  name: {{ $.Values.driverName }}
spec:
  # ControllerPublishVolume has nothing to do on the DSM, but the
  # VolumeAttachment it comes with keeps a ReadWriteOnce volume off a second
  # node, and keeps DeleteVolume waiting until every node has let go.
  attachRequired: true
  # Apply a pod's fsGroup to every volume. The default skips volumes that are
  # ReadWriteMany or have no fsType, which leaves NFS and SMB shares owned by
  # root and unusable by pods that run as another user.
  fsGroupPolicy: File
  podInfoOnMount: true
  volumeLifecycleModes:
    - Persistent
{{- end }}

{{- if $.Values.installCSIDriver }}
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  labels: {{- include "synology-csi.labels" $ | nindent 4 }}
  name: csi.san.synology.com
spec:
  # The driver implements no ControllerPublishVolume, so attaching is a no-op,
  # but the VolumeAttachment it creates is what stops Kubernetes from attaching
  # a ReadWriteOnce volume to a second node.
  attachRequired: true
  podInfoOnMount: true
  volumeLifecycleModes:
    - Persistent
{{- end }}

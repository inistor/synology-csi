{{- if $.Values.snapshotter.enabled }}
{{- range $name, $_ := $.Values.volumeSnapshotClasses }}
{{- if not .disabled }}
---
apiVersion: snapshot.storage.k8s.io/v1
{{- with .deletionPolicy }}
deletionPolicy: {{ . }}
{{- end }}
driver: {{ $.Values.driverName }}
kind: VolumeSnapshotClass
metadata:
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: {{ default "false" .isDefault | quote }}
  labels: {{- include "synology-csi.labels" $ | nindent 4 }}
  name: {{ $name }}
{{- with .parameters }}
parameters: {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

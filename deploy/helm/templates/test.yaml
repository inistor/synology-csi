---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels: {{- include "synology-csi.labels" $ | nindent 4 }}
  name: {{ include "synology-csi.fullname" $ }}-test
spec:
  accessModes:
    - ReadWriteOnce
  {{- with $.Values.test.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: 1Gi

---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app: test
    {{- include "synology-csi.labels" $ | nindent 4 }}
  name: {{ include "synology-csi.fullname" $ }}-test
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: test
        {{- include "synology-csi.labels" $ | nindent 8 }}
    spec:
      containers:
        - name: touch
          command: [ "/bin/sh", "-c", "echo 'Hello world!' >/data/file && cat /data/file" ]
          image: {{ $.Values.test.image }}
          volumeMounts:
            - mountPath: /data
              name: data
      restartPolicy: Never
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "synology-csi.fullname" $ }}-test

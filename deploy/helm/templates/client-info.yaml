{{- with $.Values.clientInfoSecret }}
{{- if .create }}
---
apiVersion: v1
kind: Secret
metadata:
  labels: {{- include "synology-csi.labels" $ | nindent 4 }}
  name: {{ .name | default (include "synology-csi.fullname" $ | printf "%s-client-info") }}
stringData:
  client-info.yml: |- {{- pick . "clients" | toYaml | nindent 4 }}
{{- end }}
{{- end }}

---
clientInfoSecret:
  # How to connect to your DSM(s).
  clients: []
  # - host: nas.example.com     # DSM hostname or IP address
  #   port: 5001                # DSM port; 5000 for HTTP, 5001 for HTTPS
  #   https: true               # whether the port expects HTTPS
  #   username: csi             # a dedicated DSM user for the driver
  #   password: secret
  #   # (optional) PEM-encoded CA certificate to verify the DSM HTTPS endpoint,
  #   # needed when DSM uses a self-signed certificate.
  #   tlsCACert: |
  #     -----BEGIN CERTIFICATE-----
  #     ...
  #     -----END CERTIFICATE-----
  #   tlsServerName: ""         # (optional) TLS server name, e.g. when connecting by IP
  #   insecureSkipVerify: false # (optional) skip TLS verification; prefer tlsCACert
  # Whether the chart creates the Secret from `clients`. Leave false to create
  # it yourself, e.g. from a secret manager.
  create: false
  # Defaults to {{ include "synology-csi.fullname" $ }}-client-info if empty or not present:
  name: "client-info-secret"
# Affinity, nodeSelector, tolerations, resources and replicas for the controller Deployment.
controller:
  affinity: { }
  nodeSelector: { }
  tolerations: [ ]
  # Applied to every container in the controller pod.
  resources: { }
  # replicas: 2   # extra replicas are standbys; leader election keeps one active
fullnameOverride: ""
images:
  attacher:
    image: registry.k8s.io/sig-storage/csi-attacher
    pullPolicy: IfNotPresent
    tag: v4.13.0
  nodeDriverRegistrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar
    pullPolicy: IfNotPresent
    tag: v2.18.0
  plugin:
    image: ghcr.io/inistor/synology-csi
    pullPolicy: IfNotPresent
    # Defaults to {{ $.Chart.AppVersion }} if empty or not present:
    tag: ""
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner
    pullPolicy: IfNotPresent
    tag: v6.4.0
  resizer:
    image: registry.k8s.io/sig-storage/csi-resizer
    pullPolicy: IfNotPresent
    tag: v2.3.0
  snapshotter:
    image: registry.k8s.io/sig-storage/csi-snapshotter
    pullPolicy: IfNotPresent
    tag: v8.7.0
installCSIDriver: true
nameOverride: ""
# Affinity, nodeSelector, tolerations and resources for the node DaemonSet.
node:
  affinity: { }
  nodeSelector: { }
  tolerations: [ ]
  # Applied to both containers in the node pod.
  resources: { }
  # If your kubelet path is not standard, specify it here, e.g. for MicroK8s:
  # /var/snap/microk8s/common/var/lib/kubelet
  kubeletPath: /var/lib/kubelet
  # Run host tools (iscsiadm, multipath) through a chroot into the host's root.
  supportChrootDir: true
  extraArgs: []
  # - --iscsiadm-path=/usr/local/sbin/iscsiadm
# Snapshot support: the csi-snapshotter sidecar and the VolumeSnapshotClasses below.
# Needs the external-snapshotter CRDs and snapshot-controller in the cluster.
snapshotter:
  enabled: true
storageClasses:
  synology-iscsi-storage:
    # One of true or false (default):
    ##disabled: false
    # One of true or false (default):
    ##isDefault: false
    # One of "Retain" or "Delete" (default):
    reclaimPolicy: Retain
    # One of "WaitForFirstConsumer" or "Immediate" (default):
    ##volumeBindingMode: Immediate
    # e.g. [ "nfsvers=4.1" ] for NFS, [ "dir_mode=0777", "file_mode=0777" ] for SMB
    ##mountOptions: []

    # If not present, some location will be chosen to create volumes with the filesystem type ext4.
    # Note that these parameters cannot get updated once deployed - any subsequent changes get ignored!
    ##parameters:
    ##  dsm: "1.1.1.1"
    ##  fsType: btrfs
    ##  location: /volume1
    ##  protocol: iscsi
# Used by `helm test`: a 1Gi PVC on this StorageClass (the cluster default if
# empty), written to by a one-off pod.
test:
  image: busybox:1.38
  storageClassName: ""
volumeSnapshotClasses:
  synology-snapshotclass:
    # One of true or false (default):
    ##disabled: false
    # One of "Retain" or "Delete" (default):
    deletionPolicy: Delete
    # One of true or false (default):
    ##isDefault: false

    # Note that these parameters cannot get updated once deployed - any subsequent changes get ignored!
    ##parameters:
    ##  description: "Kubernetes CSI"
    ##  is_locked: "false"
